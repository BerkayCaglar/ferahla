<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spike 09 — Fluent offline</title>
<script>
  // ?theme=dark|light → data-theme; otherwise the system theme
  const t = new URLSearchParams(location.search).get('theme');
  if (t) document.documentElement.dataset.theme = t;
</script>
<link rel="stylesheet" href="vendor/fluent-theme.css">
<script src="vendor/web-components.min.js"></script>
<style>
  body { margin: 0; padding: 24px; background: var(--colorNeutralBackground2); color: var(--colorNeutralForeground1);
         font-family: var(--fontFamilyBase); font-size: var(--fontSizeBase300); }
  .card { background: var(--colorNeutralBackground1); border-radius: var(--borderRadiusLarge);
          box-shadow: var(--shadow4); padding: 20px; max-width: 640px; display: grid; gap: 14px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  table { border-collapse: collapse; width: 100%; }
  td, th { text-align: left; padding: 8px; border-bottom: 1px solid var(--colorNeutralStroke2); }
  td.num { text-align: right; font-family: Consolas, monospace; }
  #status { font-family: Consolas, monospace; font-size: 12px; color: var(--colorNeutralForeground3); white-space: pre; }
</style>
</head>
<body>
<div class="card">
  <fluent-text size="600" weight="semibold">Suggestions — Turkish letters: ğüşıöç İĞÜŞÖÇ</fluent-text>
  <div class="row">
    <fluent-button appearance="primary">Move to quarantine</fluent-button>
    <fluent-button>Select safe ones</fluent-button>
    <fluent-button appearance="subtle">Clear</fluent-button>
    <fluent-badge appearance="tint" color="success">Safe</fluent-badge>
    <fluent-badge appearance="tint" color="warning">Your call</fluent-badge>
    <fluent-badge appearance="tint" color="danger">Personal</fluent-badge>
  </div>
  <div class="row">
    <fluent-checkbox checked></fluent-checkbox><span>Build cache</span>
    <fluent-switch checked></fluent-switch><span>Dark theme</span>
    <fluent-spinner size="tiny"></fluent-spinner>
  </div>
  <fluent-progress-bar value="40" max="100"></fluent-progress-bar>
  <fluent-text-input placeholder="Search a path…"></fluent-text-input>
  <fluent-tablist>
    <fluent-tab>Overview</fluent-tab><fluent-tab>Suggestions</fluent-tab><fluent-tab>Quarantine</fluent-tab>
  </fluent-tablist>
  <fluent-message-bar intent="warning">You are at 80% of your weekly Claude limit.</fluent-message-bar>
  <table>
    <tr><th>Name</th><th>Size</th></tr>
    <tr><td><fluent-checkbox></fluent-checkbox> Shader cache</td><td class="num">2.0 GB</td></tr>
    <tr><td><fluent-checkbox></fluent-checkbox> Package cache</td><td class="num">1.5 GB</td></tr>
  </table>
  <div id="status"></div>
</div>
<script>
  // Which components are really defined? (also written to the title for the headless test)
  addEventListener('load', () => setTimeout(() => {
    const tags = [...new Set([...document.querySelectorAll('*')].map(e => e.localName).filter(n => n.startsWith('fluent-')))];
    const missing = tags.filter(n => !customElements.get(n));
    const btn = document.querySelector('fluent-button');
    const bg = getComputedStyle(document.body).backgroundColor;
    const s = `defined ${tags.length - missing.length}/${tags.length}; missing=[${missing}]; shadow=${!!btn.shadowRoot}; ` +
              `theme=${document.documentElement.dataset.theme || 'system'}; bodyBg=${bg}; prefersDark=${matchMedia('(prefers-color-scheme: dark)').matches}`;
    document.getElementById('status').textContent = s;
    document.title = 'RESULT ' + s;
  }, 300));
</script>
</body>
</html>
